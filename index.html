

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEase - Online Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ShopEase</h1>
    <input id="search" type="search" placeholder="Search products...">
    <button onclick="toggleCart()">🛒 Cart (<span id="count">0</span>)</button>
  </header>

  <section class="hero">
    <h2>Discover Amazing Products</h2>
    <p>Shop your favorites at great prices.</p>
    <a href="#products">Shop Now</a>
  </section>

  <main id="products">
    <h2>Our Products</h2>
    <div class="filters">
      <button onclick="filterProducts('All')">All</button>
      <button onclick="filterProducts('Electronics')">Electronics</button>
      <button onclick="filterProducts('Fashion')">Fashion</button>
      <button onclick="filterProducts('Home')">Home</button>
    </div>
    <div id="product-list" class="products"></div>
  </main>

  <aside id="cart" class="cart hidden">
    <button class="close" onclick="toggleCart()">✕</button>
    <h2>Your Shopping Cart</h2>
    <div id="cart-items"></div>
    <h3>Total: ₹<span id="total">0</span></h3>
    <button onclick="checkout()">Checkout</button>
  </aside>

  <footer>
    <p>© 2026 ShopEase. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
